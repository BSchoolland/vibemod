<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>vibemod chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #status {
    padding: 8px 16px;
    font-size: 12px;
    color: #888;
    border-bottom: 1px solid #1a1a2e;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #status .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #555;
  }
  #status .dot.connected { background: #39ff14; }
  #status .dot.error { background: #ff1493; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, #ff1493, #ff69b4);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.ai {
    align-self: flex-start;
    background: #1a1a2e;
    border: 1px solid #2a2a3e;
    border-bottom-left-radius: 4px;
  }
  .msg.ai .cursor {
    display: inline-block;
    width: 2px;
    height: 16px;
    background: #00ffff;
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: blink 0.8s infinite;
  }
  .msg.system {
    align-self: center;
    background: transparent;
    color: #888;
    font-size: 12px;
    padding: 4px 12px;
  }
  .tool-event {
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    font-size: 12px;
    color: #888;
    font-family: 'SF Mono', 'Fira Code', monospace;
  }
  .tool-event .icon {
    width: 16px;
    text-align: center;
    flex-shrink: 0;
  }
  .tool-event.read .icon { color: #00ffff; }
  .tool-event.write .icon,
  .tool-event.edit .icon { color: #39ff14; }
  .tool-event.bash .icon { color: #ffff00; }
  .tool-event.find .icon,
  .tool-event.grep .icon,
  .tool-event.ls .icon { color: #888; }
  .tool-event .path { color: #aaa; }
  .tool-event.active .spinner {
    width: 12px; height: 12px;
    border: 2px solid #333;
    border-top-color: #00ffff;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  .tool-event.done .check { color: #39ff14; }
  .activity {
    align-self: flex-start;
    padding: 10px 16px;
    background: #1a1a2e;
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid #2a2a3e;
  }
  .activity .dots {
    display: flex;
    gap: 4px;
  }
  .activity .dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .activity .dots span:nth-child(1) { background: #ff1493; animation-delay: 0s; }
  .activity .dots span:nth-child(2) { background: #ff69b4; animation-delay: 0.2s; }
  .activity .dots span:nth-child(3) { background: #00ffff; animation-delay: 0.4s; }
  .activity .label { font-size: 12px; color: #888; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  #input-bar {
    padding: 12px 16px;
    border-top: 1px solid #1a1a2e;
  }
  #input-bar form {
    display: flex;
    gap: 8px;
    background: #1a1a2e;
    border-radius: 12px;
    padding: 4px 4px 4px 14px;
    border: 1px solid #2a2a3e;
  }
  #input-bar input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #e0e0e0;
    font-size: 14px;
  }
  #input-bar input::placeholder { color: #555; }
  #input-bar button {
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    background: linear-gradient(135deg, #ff1493, #ff69b4);
    color: white;
    font-size: 14px;
    cursor: pointer;
  }
  #input-bar button:disabled {
    opacity: 0.2;
    cursor: default;
  }
</style>
</head>
<body>

<div id="status"><span class="dot" id="dot"></span><span id="status-text">Connecting...</span></div>
<div id="messages"></div>
<div id="input-bar">
  <form id="form">
    <input id="input" placeholder="Describe what you want..." autocomplete="off" />
    <button type="submit" id="send" disabled>Send</button>
  </form>
</div>

<script>
const host = location.hostname || 'localhost';
const API = `http://${host}:3000`;
const WS_URL = `ws://${host}:3000/ws`;

const $messages = document.getElementById('messages');
const $input = document.getElementById('input');
const $form = document.getElementById('form');
const $send = document.getElementById('send');
const $dot = document.getElementById('dot');
const $status = document.getElementById('status-text');

let ws = null;
let convoId = null;
let busy = false;
let streamEl = null;
let streamBuf = '';
let hadToolSinceChunk = false;

const TOOL_ICONS = {
  read: '📖', write: '✏️', edit: '✏️', bash: '$',
  grep: '🔍', find: '🔍', ls: '📁',
};

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toolLabel(name, args) {
  const icon = TOOL_ICONS[name] || '⚙️';
  if ((name === 'read' || name === 'write' || name === 'edit') && args?.path) {
    return `<span class="icon">${icon}</span> <span class="path">${escHtml(args.path)}</span>`;
  }
  if (name === 'bash' && args?.command) {
    const cmd = args.command.length > 60 ? args.command.slice(0, 57) + '...' : args.command;
    return `<span class="icon">${icon}</span> <span class="path">${escHtml(cmd)}</span>`;
  }
  if ((name === 'grep' || name === 'find') && args) {
    const detail = args.pattern || args.glob || JSON.stringify(args);
    return `<span class="icon">${icon}</span> <span class="path">${escHtml(String(detail).slice(0, 60))}</span>`;
  }
  return `<span class="icon">${icon}</span> <span class="path">${name}</span>`;
}

function scrollBottom() {
  $messages.scrollTop = $messages.scrollHeight;
}

function addMsg(role, text) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  el.textContent = text;
  $messages.appendChild(el);
  scrollBottom();
  return el;
}

function showActivity(label) {
  hideActivity();
  const el = document.createElement('div');
  el.id = 'activity';
  el.className = 'activity';
  el.innerHTML = `<div class="dots"><span></span><span></span><span></span></div><span class="label">${label}</span>`;
  $messages.appendChild(el);
  scrollBottom();
}

function hideActivity() {
  const el = document.getElementById('activity');
  if (el) el.remove();
}

function addToolEvent(name, args, active) {
  hideActivity();
  const el = document.createElement('div');
  el.className = `tool-event ${name} ${active ? 'active' : 'done'}`;
  el.id = active ? `tool-active` : '';
  el.innerHTML = (active
    ? `<div class="spinner"></div>${toolLabel(name, args)}`
    : `<span class="check">✓</span>${toolLabel(name, args)}`
  );
  $messages.appendChild(el);
  scrollBottom();
}

function finishActiveTool(name) {
  const el = document.getElementById('tool-active');
  if (el) {
    el.classList.remove('active');
    el.classList.add('done');
    el.id = '';
    const spinner = el.querySelector('.spinner');
    if (spinner) {
      const check = document.createElement('span');
      check.className = 'check';
      check.textContent = '✓';
      spinner.replaceWith(check);
    }
  }
}

function setBusy(b) {
  busy = b;
  $send.disabled = b || !$input.value.trim();
  $input.disabled = b;
}

function setStatus(text, state) {
  $status.textContent = text;
  $dot.className = `dot ${state}`;
}

function connect() {
  setStatus('Connecting...', '');
  ws = new WebSocket(WS_URL);

  ws.onopen = () => setStatus('Connected', 'connected');

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);

    if (msg.type === 'thinking') {
      showActivity('Thinking...');
    }

    if (msg.type === 'tool_start') {
      hadToolSinceChunk = true;
      addToolEvent(msg.toolName, msg.args, true);
    }

    if (msg.type === 'tool_end') {
      finishActiveTool(msg.toolName);
    }

    if (msg.type === 'chunk') {
      hideActivity();
      finishActiveTool();
      if (hadToolSinceChunk && streamEl) {
        streamEl.textContent = streamBuf;
        streamEl = null;
        streamBuf = '';
      }
      hadToolSinceChunk = false;
      streamBuf += msg.content;
      if (!streamEl) {
        streamEl = document.createElement('div');
        streamEl.className = 'msg ai';
        $messages.appendChild(streamEl);
      }
      streamEl.innerHTML = '';
      streamEl.appendChild(document.createTextNode(streamBuf));
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      streamEl.appendChild(cursor);
      scrollBottom();
    }

    if (msg.type === 'ai_done') {
      hideActivity();
      if (streamEl) {
        streamEl.textContent = msg.message.content;
        streamEl = null;
      } else {
        addMsg('ai', msg.message.content);
      }
      streamBuf = '';
      setStatus('Rebuilding preview...', 'connected');
    }

    if (msg.type === 'rebuild_complete') {
      setStatus('Connected', 'connected');
      setBusy(false);
    }

    if (msg.type === 'error') {
      hideActivity();
      addMsg('system', `Error: ${msg.error}`);
      streamEl = null;
      streamBuf = '';
      setStatus('Connected', 'connected');
      setBusy(false);
    }
  };

  ws.onclose = () => {
    setStatus('Disconnected — reconnecting...', 'error');
    setTimeout(connect, 2000);
  };

  ws.onerror = () => {};
}

async function ensureConvo() {
  if (convoId) return convoId;
  const res = await fetch(`${API}/api/chat/conversations`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({}),
  });
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  convoId = data.conversation.id;
  return convoId;
}

$form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = $input.value.trim();
  if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;

  setBusy(true);
  $input.value = '';
  addMsg('user', text);
  showActivity('Thinking...');

  try {
    const id = await ensureConvo();
    ws.send(JSON.stringify({ type: 'send_message', conversationId: id, content: text }));
  } catch (err) {
    hideActivity();
    addMsg('system', `Failed: ${err.message}`);
    setBusy(false);
  }
});

$input.addEventListener('input', () => {
  $send.disabled = busy || !$input.value.trim();
});

connect();
</script>
</body>
</html>
